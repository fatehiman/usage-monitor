; Asale (asale.ai, buy / sell AI subscription tokens): USDT wallet balance.
; Read from the Asale client on deb21 (192.168.1.21, see E:\www\myLan\deb21.md).
; No browser / extension needed.
;
; API: POST http://192.168.1.21:9700/rpc/wallet_overview  (header X-Asale-Token: <daemon token>, body {})
;   {"balance":3927404,"debt":0,"frozen":0,"payable":31949,"unit":"micro_usdt"}
; balance is in micro USDT (factor 0.000001 -> USDT).
; Port 9700 is open only while Asale is enabled (/root/asale.sh option 1 on deb21).
;
; One-time setup: the daemon token (/root/.asale/daemon.token on deb21) is copied
; to Windows Credential Manager. Run again if the token is ever made new:
;   $env:SECRET = ssh -i ~\.ssh\id_ed25519_deb21 root@192.168.1.21 cat /root/.asale/daemon.token
;   powershell -ExecutionPolicy Bypass -File E:\www\usage-monitor\tools\set-secret.ps1 -Target UsageMonitor/Asale -User daemon-token -FromEnv SECRET

[service]
name = Asale
order = 70
icon = asale.ico
interval = 30
timeout = 20
site = http://192.168.1.21:9700

[step.wallet]
url = http://192.168.1.21:9700/rpc/wallet_overview
method = POST
header.X-Asale-Token = {{cred:UsageMonitor/Asale}}
header.Content-Type = application/json
header.Accept = application/json
body = {}
fail.401 = Asale daemon token is wrong (copy it again, see asale.conf)
fail.403 = Asale daemon token is wrong (copy it again, see asale.conf)
fail.notfound = No balance in the Asale answer
get.balance = json:balance

[indicator.balance]
type = value
value = {{balance}}
factor = 0.000001
unit = USDT
decimals = 2
warn_below = 1
alert_below = 0.3
tray = 1
; Usage spike: 0.5 USDT or more used in at least 10 minutes -> sound + "!".
spike_used = 0.5
spike_minutes = 10
