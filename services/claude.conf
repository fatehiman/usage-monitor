; Claude usage, read from the claude.ai web API with your browser session.
;
; The session cookie comes from the keep-sessions extension (E:\www\keep-sessions):
; Chrome pushes the claude.ai cookies (encrypted) to sessionman.peppasoft.com,
; and this service pulls and decrypts them. Chrome does not need to be open:
; the last pushed cookie is used.
;
; One-time setup: save the keep-sessions server token and E2E passphrase
; (input is hidden, values go to Windows Credential Manager):
;   powershell -ExecutionPolicy Bypass -File E:\www\usage-monitor\tools\set-secret.ps1 -Target UsageMonitor/KeepSessionsToken -User token
;   powershell -ExecutionPolicy Bypass -File E:\www\usage-monitor\tools\set-secret.ps1 -Target UsageMonitor/KeepSessionsPass -User passphrase
;
; Manual fallback (no keep-sessions): copy "sessionKey" from Chrome (F12 >
; Application > Cookies > https://claude.ai), save it with
;   powershell -ExecutionPolicy Bypass -File E:\www\usage-monitor\tools\set-secret.ps1
; then delete [step.session] and use {{cred:UsageMonitor/Claude}} instead of {{sk}}.

[service]
name = Claude
order = 10
icon = claude.ico
interval = 15
timeout = 20
site = https://claude.ai/settings/usage
; The service's time zone (the account's VPN country). API times without an
; offset are read in this zone. They are shown in the app zone
; (usage-monitor.ini [app] timezone=) when it is set, else in this zone.
timezone = Europe/Helsinki

; Safety gate (same as the claude-usage project): only call Claude when the
; public IP is in an allowed country. An empty IP must stop the run.
[step.ip]
url = https://api.ipify.org/
get.ip = body
require.ip = regex:^\d{1,3}(\.\d{1,3}){3}$

[step.country]
url = https://ip.peppasoft.com/?ip={{ip|url}}&c=2
get.country = body
require.country = oneof:Finland,Germany

; domain= must be the exact text of the claude.ai row in the extension.
[step.session]
url = https://sessionman.peppasoft.com/api/pull?domain=claude.ai
header.Authorization = Bearer {{cred:UsageMonitor/KeepSessionsToken}}
decrypt = keep-sessions
passphrase = {{cred:UsageMonitor/KeepSessionsPass}}
fail.401 = keep-sessions token is wrong (run set-secret.ps1, see claude.conf)
fail.notfound = No claude.ai session on the keep-sessions server
get.sk = json:cookies[name=sessionKey].value

[step.orgs]
url = https://claude.ai/api/organizations
header.Cookie = sessionKey={{sk}}
header.Accept = application/json
fail.401 = Claude session expired: open claude.ai in Chrome (keep-sessions sends the new one)
fail.403 = Claude session expired: open claude.ai in Chrome (keep-sessions sends the new one)
get.org = json:[0].uuid

[step.usage]
url = https://claude.ai/api/organizations/{{org}}/usage
header.Cookie = sessionKey={{sk}}
header.Accept = application/json
fail.401 = Claude session expired: open claude.ai in Chrome (keep-sessions sends the new one)
fail.403 = Claude session expired: open claude.ai in Chrome (keep-sessions sends the new one)
get.five = json:five_hour.utilization
get?.five_reset = json:five_hour.resets_at
get.week = json:seven_day.utilization
get?.week_reset = json:seven_day.resets_at
; Extra weekly limit for one model (null when the plan has none).
get?.model = json:limits[kind=weekly_scoped].percent
get?.model_name = json:limits[kind=weekly_scoped].scope.model.display_name
get?.model_reset = json:limits[kind=weekly_scoped].resets_at

[indicator.five]
label = 5h
type = percent
percent = {{five}}
invert = 1
reset = {{five_reset}}
warn_below = 25
alert_below = 10
tray = 1

[indicator.week]
label = Week
type = percent
percent = {{week}}
invert = 1
reset = {{week_reset}}
warn_below = 20
alert_below = 5
tray = 1

[indicator.model]
optional = 1
label = {{model_name}}
type = percent
percent = {{model}}
invert = 1
reset = {{model_reset}}
warn_below = 20
alert_below = 5
