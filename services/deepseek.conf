; DeepSeek API balance (USD), read with the API key. No browser / extension needed.
;
; API: GET https://api.deepseek.com/user/balance  (Bearer <API key>)
;   {"is_available":true,"balance_infos":[{"currency":"USD","total_balance":"3.89",...}]}
; The balance is per account, so any key of the account shows the same number.
;
; One-time setup: the key is copied from Bitwarden (AI Providers) to Windows Credential Manager:
;   bwprx-client run --query deepseek-telegram-manager --env SECRET=password -- powershell -ExecutionPolicy Bypass -File E:\www\usage-monitor\tools\set-secret.ps1 -Target UsageMonitor/DeepSeek -User api-key -FromEnv SECRET

[service]
name = DeepSeek
order = 30
icon = deepseek.ico
interval = 30
timeout = 20
site = https://platform.deepseek.com/usage

[step.balance]
url = https://api.deepseek.com/user/balance
header.Authorization = Bearer {{cred:UsageMonitor/DeepSeek}}
header.Accept = application/json
fail.401 = DeepSeek API key is wrong or revoked (see deepseek.conf)
fail.notfound = No USD balance in the DeepSeek answer
get.balance = json:balance_infos[currency=USD].total_balance

[indicator.balance]
type = value
value = {{balance}}
prefix = $
decimals = 2
warn_below = 2
alert_below = 0.5
tray = 1
; Usage spike: $0.50 or more used in at least 10 minutes -> sound + "!".
spike_used = 0.5
spike_minutes = 10
