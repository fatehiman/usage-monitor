; ElevenLabs (elevenlabs.io): credits left in this billing period + days left until the plan
; renews (or ends, if the plan is cancelled). Read with the API key. No browser / extension needed.
;
; API: GET https://api.elevenlabs.io/v1/user/subscription  (header xi-api-key: <key>)
;   {"tier":"starter","character_count":4414,"character_limit":39037,
;    "next_character_count_reset_unix":1796645129,"status":"active",...}
; Credits left = character_limit - character_count. Unused credits are reset at
; next_character_count_reset_unix (= end of the billing period).
;
; One-time setup: the key is copied from Bitwarden (AI Providers / Elevenlabs)
; to Windows Credential Manager:
;   bwprx-client run --query Elevenlabs --env SECRET=password -- powershell -ExecutionPolicy Bypass -File E:\www\usage-monitor\tools\set-secret.ps1 -Target UsageMonitor/ElevenLabs -User api-key -FromEnv SECRET

[service]
name = ElevenLabs
order = 25
icon = elevenlabs.ico
interval = 30
timeout = 20
site = https://elevenlabs.io/app/subscription

[step.subscription]
url = https://api.elevenlabs.io/v1/user/subscription
header.xi-api-key = {{cred:UsageMonitor/ElevenLabs}}
header.Accept = application/json
fail.401 = ElevenLabs API key is wrong or revoked (see elevenlabs.conf)
get.used = json:character_count
get.limit = json:character_limit
get?.renew = json:next_character_count_reset_unix

[indicator.credits]
type = value
total = {{limit}}
used = {{used}}
max = {{limit}}
unit = credits
decimals = 0
thousands = 1
warn_below = 5000
alert_below = 1000
tray = 1
; Usage spike: 2,000 credits or more used in at least 10 minutes -> sound + "!".
spike_used = 2000
spike_minutes = 10

[indicator.plan]
optional = 1
type = days
date = {{renew}}
label = left
; max = length of the plan in days (only for the pie).
max = 30
warn_below = 7
alert_below = 3
