; MihanSMSCenter main account (r-kiani): balance in IRT + SMS left. SOAP web service.
;
; API: POST https://www.mihansmscenter.com/webservice/index.php, SOAP method accountInfo(username, password)
;   <status>0</status> ... <balance>433791</balance><remaining_sms>94</remaining_sms> ...
; balance is in Rial (factor 0.1 -> IRT). status 1 = wrong user name / password.
; remaining_sms seems counted at the English SMS price; Persian SMS are cheaper.
; Tech ref: E:\www\=providers\sms\mihansms\mihansms.md
;
; Only the main account is read (not the project keys of the smsgw gateway).
; The password is read on every run from my-own-token.txt in the provider folder.
; To rotate it, just edit that file (no restart needed). The password must not
; contain & < > (it goes into XML as it is).

[service]
name = MihanSMS
order = 50
icon = mihansms.ico
interval = 60
timeout = 30
site = https://www.mihansmscenter.com

[step.account]
url = https://www.mihansmscenter.com/webservice/index.php
method = POST
header.Content-Type = text/xml; charset=utf-8
header.SOAPAction = http://www.mihansmscenter.com/webservice/#accountInfo
body = <?xml version="1.0" encoding="UTF-8"?><SOAP-ENV:Envelope xmlns:SOAP-ENV="http://schemas.xmlsoap.org/soap/envelope/"><SOAP-ENV:Body><ns1:accountInfo xmlns:ns1="http://www.mihansmscenter.com/webservice/"><username>r-kiani</username><password>{{file:E:\www\=providers\sms\mihansms\my-own-token.txt}}</password></ns1:accountInfo></SOAP-ENV:Body></SOAP-ENV:Envelope>
fail.notfound = Not a Mihan accountInfo answer
get.status = regex:<status[^>]*>(\d+)</status>
; Mihan error code: "Blocked: status = 1" = wrong user name / password (edit my-own-token.txt).
require.status = oneof:0
get?.balance = regex:<balance[^>]*>(\d+)</balance>
get?.sms = regex:<remaining_sms[^>]*>(\d+)</remaining_sms>

[indicator.balance]
type = value
value = {{balance}}
factor = 0.1
unit = IRT
decimals = 0
thousands = 1
warn_below = 20000
alert_below = 5000
tray = 1

[indicator.sms]
optional = 1
type = value
value = {{sms}}
unit = SMS
decimals = 0
thousands = 1
warn_below = 50
alert_below = 10
