; MsgWay SMS account balance (IRT), read with the API key. No browser / extension needed.
;
; API: POST https://api.msgway.com/balance/get  (header apiKey: <key>, no body)
;   {"status":"success","error":{"code":0,...},"data":{"balance":1843870}}
; data.balance is in Rial (factor 0.1 -> IRT). MsgWay gives no "remaining SMS" count.
; Tech ref: E:\www\=providers\sms\msgway\msgway.md
;
; The key is read on every run from my-own-token.txt in the provider folder.
; To rotate the key, just edit that file (no restart needed).

[service]
name = MsgWay
order = 60
icon = msgway.ico
interval = 60
timeout = 20
site = https://msgway.com

[step.balance]
url = https://api.msgway.com/balance/get
method = POST
header.apiKey = {{file:E:\www\=providers\sms\msgway\my-own-token.txt}}
header.Content-Type = application/json
header.Accept = application/json
body = {}
fail.401 = MsgWay API key is wrong or revoked (edit my-own-token.txt, see msgway.conf)
fail.403 = MsgWay API key is wrong or revoked (edit my-own-token.txt, see msgway.conf)
fail.notfound = No balance in the MsgWay answer (key wrong?)
get.balance = json:data.balance

[indicator.balance]
type = value
value = {{balance}}
factor = 0.1
unit = IRT
decimals = 0
thousands = 1
warn_below = 50000
alert_below = 10000
tray = 1
