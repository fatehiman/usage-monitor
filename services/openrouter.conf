; OpenRouter credits left (USD), read with a MANAGEMENT key (a normal inference key gets 403 here).
;
; API: GET https://openrouter.ai/api/v1/credits  (Bearer <management key>)
;   {"data":{"total_credits":10,"total_usage":0.32537468}}
; Left = total_credits - total_usage (value indicator with total + used).
;
; One-time setup: the key is copied from Bitwarden (AI Providers / openrouter-management)
; to Windows Credential Manager:
;   bwprx-client run --query openrouter-management --env SECRET=password -- powershell -ExecutionPolicy Bypass -File E:\www\usage-monitor\tools\set-secret.ps1 -Target UsageMonitor/OpenRouter -User api-key -FromEnv SECRET

[service]
name = OpenRouter
order = 40
icon = openrouter.ico
interval = 30
timeout = 20
site = https://openrouter.ai/settings/credits

[step.credits]
url = https://openrouter.ai/api/v1/credits
header.Authorization = Bearer {{cred:UsageMonitor/OpenRouter}}
header.Accept = application/json
fail.401 = OpenRouter key is wrong or revoked (see openrouter.conf)
fail.403 = OpenRouter key is not a management key (see openrouter.conf)
get.total = json:data.total_credits
get.used = json:data.total_usage

[indicator.credits]
type = value
total = {{total}}
used = {{used}}
prefix = $
decimals = 2
warn_below = 2
alert_below = 0.5
tray = 1
