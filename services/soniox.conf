; Soniox prepaid balance (USD), read with an ORGANIZATION API key (starts with snx_org_).
; A normal project key gets 401/403 here. No browser / extension needed.
;
; API: GET https://api.soniox.com/v1/organization/balance  (Bearer <org key>)
;   {"available_balance_usd":"9.79","used_balance_usd":"4.20","balance_exhausted":false,...}
;
; One-time setup: the key is copied from Bitwarden (AI Providers / Soniox-organization)
; to Windows Credential Manager:
;   bwprx-client run --query Soniox-organization --env SECRET=password -- powershell -ExecutionPolicy Bypass -File E:\www\usage-monitor\tools\set-secret.ps1 -Target UsageMonitor/Soniox -User api-key -FromEnv SECRET

[service]
name = Soniox
icon = soniox.ico
interval = 30
timeout = 20
site = https://console.soniox.com/org/billing/overview

[step.balance]
url = https://api.soniox.com/v1/organization/balance
header.Authorization = Bearer {{cred:UsageMonitor/Soniox}}
header.Accept = application/json
fail.401 = Soniox organization key is wrong or revoked (see soniox.conf)
fail.403 = Soniox key is not an organization key (see soniox.conf)
get.balance = json:available_balance_usd

[indicator.balance]
label = left
type = value
value = {{balance}}
prefix = $
decimals = 2
warn_below = 2
alert_below = 0.5
tray = 1
